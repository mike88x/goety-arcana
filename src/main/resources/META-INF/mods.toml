[[mods]]
modId="goetyarcana"
version="${file.jarVersion}"
displayName="Goety Arcana"
description='''
为诡厄巫法（Goety）添加聚晶、武器与其它奥术物品，不限于单一法术学派，后续会持续扩充。
An addon for Goety adding focuses, weapons, and other arcane items — not limited to a single spell school.

目前包含 / Currently included:
- 虚空崩灭聚晶 (Void Rupture Focus, Void)
- 荆棘藤缚聚晶 (Bramble Bind Focus, Wild)
- 虚空弩 / 虚空弩矢 (Void Crossbow & Void Bolt)
- 虚空镰刀 (Void Scythe, End Ritual weapon with a piercing, wall-phasing wave)
- 虚空苦力怕仆从 / 附魔变种 (Void Creeper servants)
- 虚空苦力怕与头颅 (Wild Void Creeper & Void Creeper Head)
- 虚空护身符 (Void Amulet: damage conversion, void rescue, death blast + Void Aegis)
- 虚空碎片 (Void Shard)
'''

